[project]
name = "gpower2"
version = "0.1.0"
description = "Clean-room statistical power analysis, validated against G*Power outputs"
requires-python = ">=3.11"
dependencies = ["scipy", "numpy"]

[project.optional-dependencies]
diff = ["statsmodels"]
mcp = ["mcp"]
test = ["pytest", "jsonschema", "statsmodels"]

[project.scripts]
gpower2 = "gpower2.cli:main"
gpower2-mcp = "gpower2.mcp_server:main"

[tool.setuptools.packages.find]
include = ["gpower2*"]

[tool.setuptools.package-data]
gpower2 = ["schemas/*.json", "reference/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: golden values from G*Power",
    "differential: comparison against independent implementations",
]
